aid: fixie
name: Fixie
description: >-
  Fixie is the company behind Ultravox Realtime, a speech-native voice AI
  platform for building natural, low-latency conversational voice agents.
  Rather than transcribing speech to text first, Ultravox processes audio
  directly to preserve tone, cadence, and pitch while cutting latency. The
  Ultravox Realtime REST API (api.ultravox.ai) lets developers create reusable
  agents, start and manage calls, define custom and built-in tools, clone and
  manage voices, build RAG corpora, wire telephony (Twilio, Telnyx, Plivo, SIP),
  and subscribe to call-lifecycle webhooks. Client SDKs ship for JavaScript,
  Python, Flutter/Dart, React Native, Kotlin/Android, and Swift/iOS. Fixie was
  backed by Redpoint Ventures; fixie.ai now redirects to ultravox.ai and its
  open models are published under the fixie-ai organization on Hugging Face.
